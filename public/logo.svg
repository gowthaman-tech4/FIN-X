<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="scrollDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16392b" />
      <stop offset="100%" stop-color="#1e4635" />
    </linearGradient>
    <linearGradient id="scrollMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#236348" />
      <stop offset="100%" stop-color="#2e7456" />
    </linearGradient>
    <linearGradient id="checkGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#e2fbe8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0a1d15" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Scroll Emblem -->
  <g transform="translate(130, 20)" filter="url(#shadow)">
    <!-- Back roll curl top -->
    <ellipse cx="65" cy="30" rx="35" ry="16" fill="#1b4332" />
    
    <!-- Top cylindrical head of scroll -->
    <path d="M 15,35 C 10,18 45,5 85,15 C 115,22 120,40 100,50 C 75,58 30,52 15,35 Z" fill="#2d6a4f" />
    
    <!-- Main Scroll Body -->
    <path d="M 22,46 L 98,52 C 105,75 110,130 92,150 C 78,162 42,168 28,154 C 18,140 18,80 22,46 Z" fill="url(#scrollMid)" />
    
    <!-- Bottom scroll curl -->
    <path d="M 28,154 C 38,168 78,168 95,152 C 102,145 106,132 100,126 C 94,120 82,126 84,136 C 85,144 65,154 42,148 C 32,146 28,152 28,154 Z" fill="#16392b" />
    
    <!-- Inner roll dark shadow -->
    <path d="M 28,60 C 35,90 32,130 38,145 C 44,115 50,75 42,56 Z" fill="#143326" opacity="0.6"/>

    <!-- Sharp Dynamic Checkmark -->
    <path d="M 8,112 L 38,142 C 45,130 75,70 128,48 C 115,62 82,120 42,158 C 32,154 18,132 8,112 Z" fill="url(#checkGlow)" />
  </g>

  <!-- Typography -->
  <text x="200" y="248" text-anchor="middle" font-family="'Linux Libertine', Georgia, serif" font-size="44" font-weight="900" fill="#1e4635" letter-spacing="4">FIN-X</text>
  <text x="200" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2e7456" letter-spacing="4">FINANCE NEWS FOR YOU</text>
</svg>
